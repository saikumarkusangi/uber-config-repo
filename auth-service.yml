server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://avnadmin:@mysql-cbb9283-saikumarkusangi02-23e6.d.aivencloud.com:14584/auth_db?ssl-mode=REQUIRED
    username: avnadmin
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true  
  security:
    user:
      name: admin
      password: admin123
      roles: ADMIN
  jwt:
    secret: mysecretkey
    expiration: 3600000
  redis:
    host: localhost
    port: 6379
    password: redispassword
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  mail:
    host: smtp.example.com
    port: 587
    username:
    password: emailpassword
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  logging:
    level:
      root: INFO
      com.example.authservice: DEBUG
  swagger:
    enabled: true
    title: Auth Service API
    description: API documentation for the Auth Service
    version: 1.0.0
    contact:
      name: API Support
      email: support@example.com
    license:
      name: Apache 2.0
    license-url: http://www.apache.org/licenses/LICENSE-2.0
  cors:
    allowed-origins: "*"
    allowed-methods: GET, POST, PUT, DELETE
    allowed-headers: "*"
    allow-credentials: true 
  session:
    timeout: 30m
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      use-key-prefix: true
  actuator:
    endpoints:
      web:
        exposure:
          include: health, info, metrics, prometheus  
    health:
      diskspace:
        enabled: true
      

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

